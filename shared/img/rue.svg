    <rect x="320" y="120" width="12" height="16"/><rect x="400" y="170" width="14" height="18"/><rect x="540" y="130" width="14" height="18"/><rect x="590" y="160" width="14" height="18"/>
  </g>
  <rect x="0" y="260" width="640" height="100" fill="#2b2d42"/>
  <rect x="0" y="258" width="640" height="6" fill="#8d99ae"/>
  <g stroke="#f4e285" stroke-width="4" stroke-dasharray="24 18"><line x1="0" y1="312" x2="640" y2="312"/></g>
  <!-- lampadaire -->
  <rect x="438" y="150" width="6" height="110" fill="#8d99ae"/>
