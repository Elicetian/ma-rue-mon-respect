    <rect x="-9" y="54" width="8" height="30" rx="3" fill="#1b1a17"/><rect x="2" y="54" width="8" height="30" rx="3" fill="#1b1a17"/>
    <rect x="-20" y="18" width="7" height="26" rx="3" fill="#e4572e"/><rect x="13" y="18" width="7" height="26" rx="3" fill="#e4572e"/>
