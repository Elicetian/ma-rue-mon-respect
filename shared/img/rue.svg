<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Une rue de nuit, une personne marche seule, une silhouette la suit">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2541"/><stop offset="1" stop-color="#3a506b"/></linearGradient></defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="540" cy="70" r="28" fill="#f4e285"/>
  <g fill="#0b132b">
    <rect x="0" y="120" width="90" height="140"/><rect x="100" y="80" width="70" height="180"/><rect x="180" y="140" width="110" height="120"/>
    <rect x="300" y="100" width="60" height="160"/><rect x="370" y="150" width="130" height="110"/><rect x="510" y="110" width="130" height="150"/>
  </g>
  <g fill="#f4e285" opacity="0.8">
