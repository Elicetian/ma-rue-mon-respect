<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Un témoin s'interpose entre la victime et le harceleur">
  <rect width="640" height="360" fill="#fff3e0"/>
  <rect x="0" y="250" width="640" height="110" fill="#ffd8a8"/>
  <circle cx="90" cy="80" r="40" fill="#ffe08a"/>
  <!-- harceleur à gauche -->
  <g transform="translate(140 150)">
    <circle cx="0" cy="0" r="18" fill="#c7b299"/>
    <path d="M-14 14 h28 l10 60 h-48 z" fill="#6c757d"/>
    <rect x="-12" y="74" width="10" height="40" rx="4" fill="#343a40"/><rect x="2" y="74" width="10" height="40" rx="4" fill="#343a40"/>
    <rect x="12" y="22" width="40" height="9" rx="4" fill="#6c757d"/>
    <path d="M-16 -8 q16 -18 32 0 v-6 q-16 -16 -32 0z" fill="#343a40"/>
    <!-- bulle -->
    <g transform="translate(10 -60)">
      <rect x="-40" y="-26" width="80" height="40" rx="12" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/>
      <path d="M-8 14 l-6 14 l16 -14z" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/>
      <path d="M-26 -14 q10 -14 20 0 q10 -14 20 0 q-20 26 -20 26 q-20 -26 -20 -26z" fill="#e4572e" opacity="0.5"/>
      <line x1="-30" y1="-20" x2="30" y2="10" stroke="#e4572e" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <!-- témoin au centre, main levée -->
  <g transform="translate(330 140)">
    <circle cx="0" cy="0" r="20" fill="#f7c59f"/>
    <path d="M-16 16 h32 l12 66 h-56 z" fill="#17a398"/>
    <rect x="-14" y="82" width="11" height="42" rx="4" fill="#1b1a17"/><rect x="3" y="82" width="11" height="42" rx="4" fill="#1b1a17"/>
    <rect x="-62" y="20" width="48" height="10" rx="5" fill="#17a398"/>
    <circle cx="-66" cy="25" r="9" fill="#f7c59f"/>
    <rect x="18" y="-30" width="10" height="56" rx="5" fill="#17a398"/>
    <circle cx="23" cy="-36" r="11" fill="#f7c59f"/>
    <path d="M-18 -10 q18 -20 36 0 v-6 q-18 -18 -36 0z" fill="#1b1a17"/>
  </g>
  <!-- victime à droite -->
  <g transform="translate(500 152)">
    <circle cx="0" cy="0" r="18" fill="#d9a066"/>
    <path d="M-13 14 h26 l9 60 h-44 z" fill="#e4572e"/>
    <rect x="-11" y="74" width="10" height="40" rx="4" fill="#1b1a17"/><rect x="2" y="74" width="10" height="40" rx="4" fill="#1b1a17"/>
    <rect x="-24" y="22" width="9" height="34" rx="4" fill="#e4572e"/><rect x="16" y="22" width="9" height="34" rx="4" fill="#e4572e"/>
    <path d="M-16 -4 q16 -22 32 0 l4 30 h-40z" fill="#3b2a1a"/>
  </g>
  <!-- cœur / soutien -->
  <path d="M420 70 q-14 -22 -28 0 q-14 22 28 44 q42 -22 28 -44 q-14 -22 -28 0z" fill="#17a398"/>
</svg>
